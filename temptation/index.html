<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Fantasy-Liga für 2 bis 6 Leute zu Temptation Island VIP, Staffel 7.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Temptation">
<meta name="theme-color" content="#1E0A2A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E0A2A" media="(prefers-color-scheme: dark)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Temptation-Liga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&display=swap">
<style>
/* Layout: one guided column (max 640px) floating over a fixed sunset wallpaper. Every surface is a translucent Liquid-Glass layer: sticky glass capsule for navigation on top, floating glass dock with the single primary action at the bottom. */
:root{
  --bg:#E8F0FB;
  --ink:#1C1C1E; --muted:#5C5E66; --hair:rgba(60,60,67,.14);
  --glass:rgba(255,255,255,.5); --glass-strong:rgba(255,255,255,.74); --glass-soft:rgba(255,255,255,.38);
  --rim:rgba(255,255,255,.55); --rim-hi:rgba(255,255,255,.98);
  --shadow:0 12px 32px rgba(30,46,84,.13), 0 1px 3px rgba(30,46,84,.08);
  --hl:inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 1px rgba(255,255,255,.3);
  --accent:#1E9E48; --on-accent:#FFFFFF; --accent-glow:rgba(30,158,72,.35);
  --p1:#0062D6; --p1-tint:rgba(0,122,255,.15); --p2:#B05800; --p2-tint:rgba(255,149,0,.2);
  --exit:#D70015; --exit-fill:#FF3B30; --exit-tint:rgba(255,59,48,.15); --good:#147A36; --good-tint:rgba(52,199,89,.2);
  --gold:#F5A300; --violet:#7C4DFF; --teal:#0B8A8A;
  --b1:#FF8FB8; --b2:#FFB86B; --b3:#5FD3C6; --b4:#B58CFF; --b5:#FFD86B;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070B16; --ink:#F5F5F7; --muted:#A4A5AD; --hair:rgba(235,235,245,.14);
    --glass:rgba(40,42,52,.48); --glass-strong:rgba(46,48,60,.74); --glass-soft:rgba(255,255,255,.09);
    --rim:rgba(255,255,255,.14); --rim-hi:rgba(255,255,255,.42);
    --shadow:0 12px 36px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.3);
    --hl:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 1px rgba(255,255,255,.04);
    --accent:#30D158; --on-accent:#032610; --accent-glow:rgba(48,209,88,.3);
    --p1:#5AA9FF; --p1-tint:rgba(10,132,255,.26); --p2:#FFAA3D; --p2-tint:rgba(255,159,10,.24);
    --exit:#FF6B63; --exit-fill:#FF453A; --exit-tint:rgba(255,69,58,.22); --good:#30D158; --good-tint:rgba(48,209,88,.2);
    --gold:#FFC94A; --violet:#B39CFF; --teal:#4FD1C5;
    --b1:#A3195B; --b2:#B25A00; --b3:#0B7F79; --b4:#5B2BC4; --b5:#8A6A00;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070B16; --ink:#F5F5F7; --muted:#A4A5AD; --hair:rgba(235,235,245,.14);
  --glass:rgba(40,42,52,.48); --glass-strong:rgba(46,48,60,.74); --glass-soft:rgba(255,255,255,.09);
  --rim:rgba(255,255,255,.14); --rim-hi:rgba(255,255,255,.42);
  --shadow:0 12px 36px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.3);
  --hl:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 1px rgba(255,255,255,.04);
  --accent:#30D158; --on-accent:#032610; --accent-glow:rgba(48,209,88,.3);
  --p1:#5AA9FF; --p1-tint:rgba(10,132,255,.26); --p2:#FFAA3D; --p2-tint:rgba(255,159,10,.24);
  --exit:#FF6B63; --exit-fill:#FF453A; --exit-tint:rgba(255,69,58,.22); --good:#30D158; --good-tint:rgba(48,209,88,.2);
  --gold:#FFC94A; --violet:#B39CFF; --teal:#4FD1C5;
  --b1:#A3195B; --b2:#B25A00; --b3:#0B7F79; --b4:#5B2BC4; --b5:#8A6A00;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--p1);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
p{margin:0}

/* wallpaper */
.wall{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
.wall i{position:absolute;border-radius:50%;opacity:.85}
.wall i:nth-child(1){width:75vmax;height:75vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,var(--b1) 0,transparent 68%)}
.wall i:nth-child(2){width:60vmax;height:60vmax;right:-22vmax;top:-6vmax;background:radial-gradient(circle,var(--b2) 0,transparent 68%)}
.wall i:nth-child(3){width:70vmax;height:70vmax;left:-24vmax;bottom:-34vmax;background:radial-gradient(circle,var(--b3) 0,transparent 68%)}
.wall i:nth-child(4){width:58vmax;height:58vmax;right:-20vmax;bottom:-18vmax;background:radial-gradient(circle,var(--b4) 0,transparent 68%)}
.wall i:nth-child(5){width:45vmax;height:45vmax;left:20vw;top:30vh;background:radial-gradient(circle,var(--b5) 0,transparent 68%);opacity:.55}
@media (prefers-reduced-motion:no-preference){
  .wall i:nth-child(odd){animation:drift 26s ease-in-out infinite alternate}
  .wall i:nth-child(even){animation:drift 32s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vmax,3vmax,0) scale(1.08)}}
}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto}

/* glass material */
.card,.side,.flowhead,.dock,.opt,.banner,.champ,.cc,.livebar>div,.okmsg,.seg{
  position:relative;background:var(--glass);border:0;
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:var(--hl),var(--shadow);
}
.pcard::before,.fx-card::before,.sheet::before,.card::before,.side::before,.flowhead::before,.dock::before,.opt::before,.banner::before,.champ::before,.cc::before,.livebar>div::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,var(--rim-hi),rgba(255,255,255,0) 34%,rgba(255,255,255,0) 66%,var(--rim));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
.card .opt,.card .seg,.cc .seg{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass-soft)}

/* header */
.top{padding-top:22px;display:flex;flex-direction:column;gap:2px}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:0}
.sub{color:var(--muted);font-size:14px}
.sub strong{color:var(--ink);font-weight:650}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;margin-top:14px}
.side{border-radius:26px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.side.t1{background:linear-gradient(var(--p1-tint),var(--p1-tint)),var(--glass)}
.side.t2{background:linear-gradient(var(--p2-tint),var(--p2-tint)),var(--glass)}
.side .pname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.t1 .pname,.side.t1 .score{color:var(--p1)} .side.t2 .pname,.side.t2 .score{color:var(--p2)}
.score{font-family:var(--round);font-weight:700;font-size:clamp(40px,12vw,56px);line-height:1;margin-top:4px;letter-spacing:-.03em}
.side .meta{font-size:13px;color:var(--muted)}
.lead-tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:var(--glass-strong);box-shadow:var(--hl);margin-bottom:4px}
.side:not(.lead) .lead-tag{visibility:hidden}
.vs{align-self:center;font-weight:700;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em}

main{display:flex;flex-direction:column;gap:14px;padding-top:18px}

/* navigation capsule */
.flowhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:7;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:999px;padding:6px 16px 6px 6px;min-height:48px}
.back{border:0;background:var(--glass-soft);box-shadow:var(--hl);color:var(--p1);font-weight:600;font-size:15px;padding:8px 14px 8px 10px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.back span{font-size:22px;line-height:.8;margin-top:-2px}
.flowhead>span:first-child{padding-left:10px}
.stepinfo{font-size:12px;font-weight:600;color:var(--muted);text-align:right}
.dots{display:flex;gap:4px;margin-top:4px;justify-content:flex-end}
.dots i{width:16px;height:5px;border-radius:3px;background:var(--hair)}
.dots i.on{background:var(--accent)}

.q{font-size:clamp(26px,7vw,30px);font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:4px 2px 0;text-wrap:balance}
.q .t1{color:var(--p1)} .q .t2{color:var(--p2)}
.bigtitle{font-size:28px;font-weight:800;letter-spacing:-.025em;margin:0}
.hint{color:var(--muted);font-size:15px;margin:0 2px}
.card .hint{margin:0}
.card{border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-size:20px;font-weight:750;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font-size:17px;font-weight:700;margin:0}
.label{font-size:13px;font-weight:600;color:var(--muted);margin:6px 4px 0;text-transform:uppercase;letter-spacing:.04em}

/* options */
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:24px;padding:14px 16px;cursor:pointer;min-height:60px}
.opt .ot{display:flex;flex-direction:column;min-width:0;flex:1}
.opt .ot b{font-size:17px;font-weight:650}
.opt .ot small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .tick{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:transparent;background:var(--glass-soft);box-shadow:inset 0 0 0 1.5px var(--hair)}
.opt[aria-pressed="true"]{background:linear-gradient(var(--good-tint),var(--good-tint)),var(--glass);box-shadow:var(--hl),inset 0 0 0 2px var(--accent),var(--shadow)}
.opt[aria-pressed="true"] .tick{background:var(--accent);box-shadow:none;color:var(--on-accent)}
.opt.t1[aria-pressed="true"]{background:linear-gradient(var(--p1-tint),var(--p1-tint)),var(--glass);box-shadow:var(--hl),inset 0 0 0 2px var(--p1),var(--shadow)}
.opt.t1[aria-pressed="true"] .tick{background:var(--p1);color:#fff}
.opt.t2[aria-pressed="true"]{background:linear-gradient(var(--p2-tint),var(--p2-tint)),var(--glass);box-shadow:var(--hl),inset 0 0 0 2px var(--p2),var(--shadow)}
.opt.t2[aria-pressed="true"] .tick{background:var(--p2);color:#fff}
.opt .tag{font-size:11.5px;font-weight:700;color:var(--good);background:var(--good-tint);padding:3px 9px;border-radius:999px;white-space:nowrap}

/* buttons */
.actions{display:flex;flex-direction:column;gap:8px}
.dock{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:6;padding:8px;border-radius:32px;margin-top:4px}
.btn{border:0;background:var(--glass-soft);box-shadow:var(--hl),inset 0 0 0 1px var(--rim);padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink)}
.btn.big{padding:16px 20px;font-size:17px;border-radius:26px;width:100%}
.btn.primary{background:var(--accent);background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%);color:var(--on-accent);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px var(--accent-glow)}
.btn.primary:disabled{background:var(--glass-soft);background-image:none;color:var(--muted);box-shadow:var(--hl),inset 0 0 0 1px var(--hair);cursor:not-allowed}
.btn.danger{color:var(--exit)}
.btn.big.danger{background:var(--exit-fill);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 22px var(--exit-tint)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:active,.opt:active,.chip:active,.evbtn:active{transform:scale(.98)}
.linkrow{gap:0;padding-block:6px}
.link{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--hair);background:transparent;padding:14px 2px;font-weight:500;font-size:17px;cursor:pointer;text-align:left}
.link:last-child{border-bottom:0}
.link span:last-child{color:var(--muted);font-size:20px;line-height:1}
.err{color:var(--exit);font-weight:600;font-size:15px;margin:0 4px}
.okmsg{background:linear-gradient(var(--good-tint),var(--good-tint)),var(--glass);color:var(--good);font-weight:600;font-size:15px;border-radius:20px;padding:12px 16px}
input[type=text],input[type=password],textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--glass-soft);border:0;box-shadow:var(--hl),inset 0 0 0 1px var(--hair);border-radius:16px;padding:14px 16px;width:100%;max-width:100%}
input[type=text]:focus,input[type=password]:focus{outline:none;box-shadow:var(--hl),inset 0 0 0 2px var(--accent)}
textarea{min-height:110px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
label.f.t1{color:var(--p1)} label.f.t2{color:var(--p2)}

.banner{border-radius:26px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.banner.t1{background:linear-gradient(var(--p1-tint),var(--p1-tint)),var(--glass);color:var(--p1)}
.banner.t2{background:linear-gradient(var(--p2-tint),var(--p2-tint)),var(--glass);color:var(--p2)}
.banner b{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.banner span{font-size:14px;font-weight:500;color:var(--muted)}

/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.team-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.t1 .dot{background:var(--p1)} .t2 .dot{background:var(--p2)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.plist li:last-child{border-bottom:0}
.plist .cn{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .num{font-family:var(--round);font-weight:700;min-width:2.4em;text-align:right}
.plist li.empty{display:block;color:var(--muted);font-size:14px}
.st{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--glass-soft);color:var(--muted);white-space:nowrap}
.st.out{background:var(--exit-tint);color:var(--exit)} .st.ok{background:var(--good-tint);color:var(--good)}
.own{display:inline-block;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.own.t1{background:var(--p1-tint);color:var(--p1)} .own.t2{background:var(--p2-tint);color:var(--p2)} .own.free{background:var(--glass-soft);color:var(--muted)}

/* progress */
.eps{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.ep{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600}
.ep i{width:100%;height:8px;border-radius:4px;background:var(--glass-soft);box-shadow:inset 0 0 0 1px var(--hair)}
.ep.done i{background:var(--accent);box-shadow:none} .ep.now i{background:var(--p2);box-shadow:none} .ep.pre{opacity:.4}
.ep.now{color:var(--ink)}

/* live */
.livebar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.livebar div{border-radius:20px;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;font-size:15px;min-width:0}
.livebar div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.livebar .t1{background:linear-gradient(var(--p1-tint),var(--p1-tint)),var(--glass);color:var(--p1)}
.livebar .t2{background:linear-gradient(var(--p2-tint),var(--p2-tint)),var(--glass);color:var(--p2)}
.livebar b{font-family:var(--round);font-weight:700;font-size:24px}
.teamlabel{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin:8px 4px 0}
.cc{border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cc-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.cc-name{min-width:0}
.cc-name strong{display:block;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-name .full{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-pts{font-family:var(--round);font-weight:700;font-size:26px;min-width:2.2em;text-align:right;line-height:1}
.cc-pts.neg{color:var(--exit)}
.grp{display:flex;flex-direction:column;gap:8px}
.grp .label{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.cg{display:inline-flex;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--glass-soft);box-shadow:var(--hl),inset 0 0 0 1px var(--hair);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink)}
.chip .pts{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.chip.on .pts{color:inherit;opacity:.7}
.chip .cnt{font-weight:800}
.minus{border:0;background:var(--glass-strong);box-shadow:var(--hl),inset 0 0 0 1px var(--hair),0 2px 6px rgba(0,0,0,.12);width:32px;height:32px;border-radius:50%;margin-left:-8px;cursor:pointer;font-weight:700;font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--ink)}
.toast{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:6}

/* exits */
.exrow{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-bottom:1px solid var(--hair)}
.exrow:last-child{border-bottom:0}
.exrow .nm{display:flex;justify-content:space-between;gap:8px;align-items:center}
.exrow .nm b{font-size:17px;font-weight:650}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;border-radius:16px;padding:4px;box-shadow:inset 0 0 0 1px var(--hair)}
.seg button{border:0;background:transparent;border-radius:12px;padding:10px 4px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}

function prevDone(f){ var ns=epNums(), l=null; ns.forEach(function(n){ if(n<f && main.episodes[n].status==="done") l=n; }); return l; }
function onIsland(per,f){ return (per.inFrom||1)<=f && (per.outIn==null || per.outIn>=f); }
function stillIn(per,f){ return (per.inFrom||1)<=f && (per.outIn==null || per.outIn>f); }
function islandAt(f){ return main.persons.filter(function(p){ return onIsland(p,f); }); }

/* draft */
function draftSeq(){
  var C=cache(); if(C.seq) return C.seq;
  var N=main.order.length, seq=[];
  for(var r=0;r<main.team.v+main.team.t;r++){
    var row=r%2===0?main.order.slice():main.order.slice().reverse();
    row.forEach(function(p){ seq.push({p:p,kind:r<main.team.v?"v":"t"}); });
  }
  C.seq=N?seq:[]; return C.seq;
}
function draftState(){
  var C=cache(); if(C.ds) return C.ds;
  var seq=draftSeq(), taken={}, picks=[], i;
  for(i=0;i<seq.length;i++){
    var e=E[seq[i].p], pk=e&&e.picks[i];
    if(!pk||!pk.person) break;
    var per=personById(pk.person);
    if(!per||per.kind!==seq[i].kind||taken[per.id]) break;
    taken[per.id]=seq[i].p; picks.push({slot:i,p:seq[i].p,person:per.id});
  }
  C.ds={seq:seq,picks:picks,slot:i,next:i<seq.length?seq[i]:null,taken:taken,complete:seq.length>0&&i>=seq.length};
  return C.ds;
}
function draftPool(kind){ var ds=draftState(), st=main.start||1; return main.persons.filter(function(p){ return p.kind===kind && !ds.taken[p.id] && onIsland(p,st); }); }
function owners(){
  var C=cache(); if(C.own) return C.own;
  var own={}, ds=draftState();
  Object.keys(ds.taken).forEach(function(k){ own[k]=ds.taken[k]; });
  Object.keys(main.assign).forEach(function(k){ if(main.assign[k]) own[k]=main.assign[k]; else delete own[k]; });
  C.own=own; return own;
}
function ownerOf(perId){ return owners()[perId]||null; }
function team(pid){ var own=owners(); return main.persons.filter(function(p){ return own[p.id]===pid; }); }

/* scoring */
function epMods(f){ return {infl:1,mult:{}}; }
function personPts(per,f){
  var e=ep(f); if(!e || f<(main.start||1) || !onIsland(per,f)) return 0;
  var md=epMods(f), p=0;
  e.log.forEach(function(x){ if(x.ids.indexOf(per.id)>=0) p+=evPts(x.k)*md.infl; });
  if(closed(f)){
    if(stillIn(per,f)) p+=main.rules.auto.island;
    if(per.outIn===f && per.outType==="freiwillig") p+=main.rules.auto.quit;
  }
  if(md.mult[per.id]!=null) p*=md.mult[per.id];
  return p;
}
function personTotal(per){ var t=0; epNums().forEach(function(f){ t+=personPts(per,f); }); return t; }
function seasonPts(pid){ var L=seasonLedger(); return L.pay[pid]||0; }
function teamEp(pid,f){ var t=0; team(pid).forEach(function(p){ t+=personPts(p,f); }); return t; }
function playerEp(pid,f){ if(f<(main.start||1)) return 0; return teamEp(pid,f)+betPts(pid,f)+survPts(pid,f); }
function total(pid){ var C=cache(); C.tot=C.tot||{}; if(C.tot[pid]!=null) return C.tot[pid]; var t=seasonPts(pid); epNums().forEach(function(f){ t+=playerEp(pid,f); }); C.tot[pid]=t; return t; }
function ranking(){ return players().slice().sort(function(a,b){ return total(b)-total(a) || players().indexOf(a)-players().indexOf(b); }); }

/* ---------- betting office ---------- */
function sumStakes(map){ var t=0; if(!map||typeof map!=="object") return 0; Object.keys(map).forEach(function(q){ var m=map[q]; if(m&&typeof m==="object") Object.keys(m).forEach(function(o){ t+=(+m[o])|0; }); else t+=(+m)|0; }); return t; }
function epQuestions(f){
  var e=ep(f); if(!e) return [];
  var C=cache(); C.q=C.q||{}; if(C.q[f]) return C.q[f];
  var isl=islandAt(f), vs=isl.filter(function(p){ return p.kind==="v"; }), ts=isl.filter(function(p){ return p.kind==="t"; });
  var lab=function(p){ return {id:p.id,label:p.name}; };
  var qs=[
    {id:"grenze",title:"Wer überschreitet die Grenze?",hint:"Kuss oder gemeinsame Nacht mit einem*r Verführer*in. Den Jackpot gibt es nur in diesem Pott.",opts:vs.map(lab).concat([{id:"none",label:"Niemand"}])},
    {id:"traenen",title:"Wer weint?",opts:vs.map(lab).concat([{id:"t",label:"Eine*r der Verführer*innen"},{id:"none",label:"Niemand"}])},
    {id:"out",title:"Wer muss die Insel verlassen?",opts:ts.map(lab).concat([{id:"v",label:"Eine vergebene Person"},{id:"none",label:"Niemand"}])},
    {id:"kuesse",title:"Wie viele Küsse gibt es?",opts:[{id:"0",label:"Keinen"},{id:"1",label:"Einen"},{id:"2",label:"Zwei"},{id:"3",label:"Drei oder mehr"}]},
    {id:"notfall",title:"Gibt es ein Notfall-Lagerfeuer?",opts:[{id:"ja",label:"Ja"},{id:"nein",label:"Nein"}]}
  ];
  e.custom.forEach(function(c){ qs.push({id:"c-"+c.id,title:c.q,opts:c.opts,custom:c}); });
  C.q[f]=qs; return qs;
}
function qWinners(f,q){
  if(!closed(f)) return null;
  var log=ep(f).log, isT=function(id){ var p=personById(id); return !!p&&p.kind==="t"; };
  var has=function(pid,pred){ return log.some(function(x){ return pred(x.k)&&x.ids.indexOf(pid)>=0; }); };
  var w;
  if(q.id==="grenze"){ w=q.opts.filter(function(o){ return o.id!=="none" && has(o.id,function(k){ return GRENZE.indexOf(k)>=0; }); }).map(function(o){ return o.id; }); return w.length?w:["none"]; }
  if(q.id==="traenen"){ w=q.opts.filter(function(o){ return o.id!=="none"&&o.id!=="t"&&has(o.id,function(k){ return k==="traenen"; }); }).map(function(o){ return o.id; });
    if(log.some(function(x){ return x.k==="traenen" && x.ids.some(isT); })) w.push("t"); return w.length?w:["none"]; }
  if(q.id==="out"){ var outs=main.persons.filter(function(p){ return p.outIn===f; });
    w=outs.filter(function(p){ return p.kind==="t" && q.opts.some(function(o){ return o.id===p.id; }); }).map(function(p){ return p.id; });
    if(outs.some(function(p){ return p.kind==="v"; })) w.push("v"); return w.length?w:["none"]; }
  if(q.id==="kuesse") return [String(Math.min(3,log.filter(function(x){ return x.k==="kuss"; }).length))];
  if(q.id==="notfall") return [log.some(function(x){ return x.k==="notfall"; })?"ja":"nein"];
  if(q.custom) return Array.isArray(q.custom.win)?q.custom.win:null;
  return null;
}
function potSettle(stakes,winners,bank){
  var r={pay:{},T:bank||0,SW:0,roll:0,w:winners||[]};
  Object.keys(stakes).forEach(function(pid){ var m=stakes[pid]||{}; Object.keys(m).forEach(function(o){ var n=(+m[o])|0; r.T+=n; if(r.w.indexOf(o)>=0) r.SW+=n; }); });
  if(r.SW>0) Object.keys(stakes).forEach(function(pid){ var mine=0, m=stakes[pid]||{}; r.w.forEach(function(o){ mine+=(+m[o])|0; }); if(mine>0) r.pay[pid]=Math.round(r.T*mine/r.SW); });
  else r.roll=r.T;
  return r;
}
function betLedger(){
  var C=cache(); if(C.bl) return C.bl;
  var out={ep:{},nextBank:0}, carry=0;
  epNums().forEach(function(f){
    if(f<(main.start||1)) return;
    var e=ep(f), r={pay:{},q:{},live:{},bankIn:carry,roll:0};
    out.ep[f]=r;
    if(!closed(f)) return;
    epQuestions(f).forEach(function(q){
      var st={}; players().forEach(function(pid){ var b=E[pid]&&E[pid].bets[f]; if(b&&b.stakes&&b.stakes[q.id]) st[pid]=b.stakes[q.id]; });
      var sres=potSettle(st,qWinners(f,q)||[],q.id==="grenze"?carry:0);
      r.q[q.id]=sres; r.roll+=sres.roll;
      Object.keys(sres.pay).forEach(function(pid){ r.pay[pid]=(r.pay[pid]||0)+sres.pay[pid]; });
    });
    e.live.forEach(function(l){
      var st={}; players().forEach(function(pid){ var b=E[pid]&&E[pid].live[f+":"+l.id]; if(b&&b.stake) st[pid]=b.stake; });
      var sres=potSettle(st,l.state==="done"&&l.win?l.win:[],0);
      r.live[l.id]=sres; r.roll+=sres.roll;
      Object.keys(sres.pay).forEach(function(pid){ r.pay[pid]=(r.pay[pid]||0)+sres.pay[pid]; });
    });
    carry=r.roll;
  });
  out.nextBank=carry;
  C.bl=out; return out;
}
function betPts(pid,f){ var r=betLedger().ep[f]; return (r&&r.pay[pid])||0; }
function jackpotFor(f){ var L=betLedger(), r=L.ep[f]; return r?r.bankIn:L.nextBank; }
function survLedger(){
  var C=cache(); if(C.sv) return C.sv;
  var out={}, base=main.rules.bets.surv;
  players().forEach(function(pid){
    var streak=0, r={pts:{},res:{},streak:0,used:[]};
    epNums().forEach(function(f){
      if(f<(main.start||1)) return;
      var b=E[pid]&&E[pid].bets[f], pick=(b&&!b.hidden&&b.surv)||null;
      if(pick) r.used.push(pick);
      if(!closed(f)) return;
      var per=pick&&personById(pick);
      if(per && stillIn(per,f)){ streak++; r.pts[f]=base*streak; r.res[f]={ok:true,pick:pick,streak:streak}; }
      else { r.res[f]={ok:false,pick:pick}; streak=0; }
    });
    r.streak=streak; out[pid]=r;
  });
  C.sv=out; return out;
}
function survPts(pid,f){ var s=survLedger()[pid]; return (s&&s.pts[f])||0; }
function seasonQuestions(){
  return main.couples.map(function(c){ return {id:c.id,title:c.name,opts:[{id:"together",label:"Gemeinsam"},{id:"apart",label:"Getrennt"}]}; })
    .concat([{id:"count",title:"Wie viele Paare gehen gemeinsam?",opts:main.couples.map(function(c,i){ return {id:String(i),label:String(i)}; }).concat([{id:String(main.couples.length),label:String(main.couples.length)}])}]);
}
function seasonLedger(){
  var C=cache(); if(C.sl) return C.sl;
  var out={pay:{},q:{},done:main.couples.length>0 && main.couples.every(function(c){ return c.final; })};
  if(out.done){
    var together=main.couples.filter(function(c){ return c.final==="together"; }).length;
    seasonQuestions().forEach(function(q){
      var st={}; players().forEach(function(pid){ var se=E[pid]&&E[pid].season; if(se&&se.stakes&&se.stakes[q.id]) st[pid]=se.stakes[q.id]; });
      var w=q.id==="count"?[String(together)]:[main.couples.filter(function(c){ return c.id===q.id; })[0].final];
      var r=potSettle(st,w,0); out.q[q.id]=r;
      Object.keys(r.pay).forEach(function(pid){ out.pay[pid]=(out.pay[pid]||0)+r.pay[pid]; });
    });
  }
  C.sl=out; return out;
}
function liveLeft(pid,f){ var u=0, lv=(E[pid]&&E[pid].live)||{}; Object.keys(lv).forEach(function(k){ if(k.indexOf(f+":")===0 && lv[k] && lv[k].stake) u+=sumStakes(lv[k].stake); }); return main.rules.bets.live-u; }

/* ================= network ================= */
function rpc(fn,body){
  return fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},body:JSON.stringify(body)})
    .then(function(r){ return r.text().then(function(t){
      if(!r.ok){ var msg="HTTP "+r.status; try{ msg=JSON.parse(t).message||msg; }catch(e){} var err=new Error(msg); err.server=r.status<500; throw err; }
      return t?JSON.parse(t):null; }); });
}
function setNet(m){ net.mode=m; renderSync(); }
function mainBusy(){ return net.mainWriting||net.mainTimer!==null||net.mainAgain; }
function upsertLocal(player,key,data){
  var found=false;
  entries=entries.map(function(r){ if(r.player===player&&r.key===key){ found=true; return {player:player,key:key,data:data,at:r.at}; } return r; });
  if(!found) entries.push({player:player,key:key,data:data,at:new Date().toISOString()});
}
function pullInfo(){
  var code=CODE;
  rpc("tl_info",{p_code:code}).then(function(res){
    if(code!==CODE) return; net.loaded=true;
    if(!res){ net.notFound=true; net.info=null; } else { net.notFound=false; net.info=res; }
    if(net.mode!=="online") setNet("online"); requestRender();
  },function(){ setNet("offline"); });
}
function pull(){
  if(!CODE||net.pulling) return;
  if(!ME||!SECRET){ pullInfo(); return; }
  net.pulling=true;
  var code=CODE;
  rpc("tl_get",{p_code:code,p_player:ME,p_secret:SECRET}).then(function(res){
    net.pulling=false; if(code!==CODE) return;
    net.loaded=true;
    if(res && res.auth===false){ clearMe(); ui.whoMsg="Dein Anmeldecode gilt nicht mehr. Frag den Admin nach einem neuen Code."; ui.key=""; render(); pullInfo(); return; }
    if(res && res.me){ var adm=!!res.me.admin; if(adm!==ui.adminOk){ ui.adminOk=adm; lsSet(LS+":isadmin:"+CODE,adm?"1":null); } }
    var d=res&&normalizeMain(res.data);
    if(!d){ net.notFound=true; main=null; requestRender(); return; }
    net.notFound=false;
    var changed=false;
    if(!mainBusy() && !net.mainFailed && (!main || +res.version>version || (+res.version===version && JSON.stringify(d)!==JSON.stringify(main)))){
      if(JSON.stringify(d)!==JSON.stringify(main)) changed=true;
      main=d; version=+res.version;
    }
    var ent=(res.entries||[]).filter(validEntry).map(function(r){ return {player:r.player,key:r.key,data:r.data,at:r.at}; });
    Object.keys(net.pend).forEach(function(pk){ var it=net.pend[pk], hit=false;
      ent=ent.map(function(r){ if(r.player===it.player&&r.key===it.key){ hit=true; return {player:r.player,key:r.key,data:it.data,at:r.at}; } return r; });
      if(!hit) ent.push({player:it.player,key:it.key,data:it.data,at:new Date().toISOString()});
    });
    if(JSON.stringify(ent)!==JSON.stringify(entries)){ entries=ent; changed=true; }
    var pots=res.pots||{}; if(JSON.stringify(pots)!==JSON.stringify(net.pots||{})){ net.pots=pots; changed=true; }
    saveCache();
    if(net.mode!=="online") setNet("online");
    flushPend();
    if(net.mainFailed && !mainBusy()) flushMain();
    if(changed){ CACHE=null; requestRender(); }
  },function(){ net.pulling=false; setNet("offline"); });
}
function saveEntry(player,key,data,failMsg){
  upsertLocal(player,key,data);
  var pk=player+"|"+key; net.pend[pk]={player:player,key:key,data:data,fail:failMsg,as:player!==ME?player:null};
  CACHE=null; saveCache(); render(); sendEntry(pk);
}
function sendEntry(pk){
  var it=net.pend[pk]; if(!it||it.sending) return; it.sending=true;
  rpc("tl_save_entry",{p_code:CODE,p_player:ME,p_secret:SECRET,p_key:it.key,p_data:it.data,p_as:it.as}).then(function(ok){
    if(net.pend[pk]===it) delete net.pend[pk];
    if(ok!==true){ ui.flashErr=it.fail||"Das ging leider nicht mehr. Der Stand wurde aktualisiert."; net.pulling=false; pull(); requestRender(); }
    else if(net.mode!=="online") setNet("online");
  },function(err){
    if(err&&err.server){ if(net.pend[pk]===it) delete net.pend[pk]; ui.flashErr=it.fail||"Das ging leider nicht. Der Stand wurde aktualisiert."; net.pulling=false; pull(); requestRender(); return; }
    it.sending=false; setNet("offline");
  });
}
function flushPend(){ Object.keys(net.pend).forEach(sendEntry); }
function commitMain(){
  main.updated=Date.now(); CACHE=null; saveCache(); render();
  clearTimeout(net.mainTimer); net.mainTimer=setTimeout(flushMain,300);
}
function flushMain(){
  clearTimeout(net.mainTimer); net.mainTimer=null;
  if(net.mainWriting){ net.mainAgain=true; return; }
  net.mainWriting=true;
  rpc("tl_save_league",{p_code:CODE,p_player:ME,p_secret:SECRET,p_data:main}).then(function(v){ net.mainFailed=false; if(+v) version=+v; if(net.mode!=="online") setNet("online"); done(); if(!net.mainWriting&&!net.mainTimer) pull(); },
    function(err){ if(err&&err.server){ net.mainFailed=false; ui.flashErr="Speichern abgelehnt: Nur der Admin darf die Liga ändern."; net.pulling=false; pull(); done(); return; } net.mainFailed=true; setNet("offline"); done(); });
  function done(){ net.mainWriting=false; if(net.mainAgain){ net.mainAgain=false; flushMain(); } }
}
function renderSync(){
  var el=document.getElementById("sync"); if(!el) return;
  var txt={connecting:"Verbinde …",online:"Live verbunden",offline:"Gerade offline: wird gespeichert, sobald wieder Netz da ist"}[net.mode];
  el.className="sync "+(net.mode==="online"?"cloud":(net.mode==="offline"?"error":"")); el.querySelector("span").textContent=CODE?txt:"";
}

var bootAt=Date.now(), fxTimer=null;
function leadCheck(){
  if(!main||main.phase==="join"||main.phase==="draft") return;
  var rk=ranking(); if(rk.length<2) return;
  var ld=total(rk[0])>total(rk[1])?rk[0]:null, prev=ui.lastLead;
  if(ld!==null){
    if(prev!==undefined && ld!==prev && Date.now()-bootAt>3500) showLeadFx(ld,prev);
    ui.lastLead=ld;
  } else if(prev===undefined) ui.lastLead=null;
}
function showLeadFx(ld,prev){
  if(typeof document.createElement!=="function") return;
  var host=document.getElementById("fx"); if(!host) return;
  clearTimeout(fxTimer);
  var reduce=false; try{ reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  var kicker=prev==null?"Erste Führung":"Neue Spitze", line=(ld===ME?"Du führst":"führt")+" mit "+total(ld)+" Punkten";
  host.innerHTML='<div class="fx-wrap'+(reduce?" calm":"")+'" role="status"><canvas class="fx-confetti" aria-hidden="true"></canvas><button class="fx-card pc '+pcls(ld)+'" data-act="fx-close" aria-label="'+kicker+': '+pname(ld)+'. Schließen"><span class="fx-crown">'+CROWN_SVG+'</span><span class="fx-kicker">'+kicker+'</span><b>'+pname(ld)+'</b><span class="fx-line">'+h(line)+'</span></button></div>';
  if(!reduce) confetti(host.querySelector("canvas"),ld);
  try{ if(navigator.vibrate) navigator.vibrate([30,60,30]); }catch(e){}
  fxTimer=setTimeout(function(){ var w=host.querySelector(".fx-wrap"); if(w) w.className+=" out"; fxTimer=setTimeout(function(){ host.innerHTML=""; },450); },reduce?3200:2800);
}
function confetti(cv,ld){
  if(!cv||!cv.getContext||!window.requestAnimationFrame) return;
  var dpr=Math.min(2,window.devicePixelRatio||1), W=window.innerWidth, H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; var ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  var cs=getComputedStyle(document.documentElement), pc=getComputedStyle(document.querySelector(".fx-card")||document.documentElement).getPropertyValue("--pc").trim();
  var cols=[pc||"#C2186B",cs.getPropertyValue("--gold").trim()||"#F5A300","#FF6B9A","#3DD6C8"], parts=[], ox=W/2, oy=Math.min(H*0.28,250);
  for(var i=0;i<150;i++){ var a=rnd()*Math.PI*2, sp=3+rnd()*8; parts.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,w:5+rnd()*6,hh:8+rnd()*8,r:rnd()*6.28,vr:(rnd()-.5)*.4,c:cols[i%cols.length]}); }
  var t0=null, dur=2400;
  function step(t){ if(t0===null) t0=t; var k=(t-t0)/dur; ctx.clearRect(0,0,W,H); if(k>=1||!cv.isConnected) return;
    for(var i=0;i<parts.length;i++){ var q=parts[i]; q.vy+=0.22; q.vx*=0.985; q.vy*=0.985; q.x+=q.vx; q.y+=q.vy; q.r+=q.vr;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-k*k); ctx.translate(q.x,q.y); ctx.rotate(q.r); ctx.fillStyle=q.c; ctx.fillRect(-q.w/2,-q.hh/2,q.w,q.hh*Math.abs(Math.cos(q.r*2))+2); ctx.restore(); }
    requestAnimationFrame(step); }
  requestAnimationFrame(step);
}

      ui.screen="home"; ui.key=""; ui.flash=e.finale?"":epName(f)+" ist abgeschlossen. Alle sehen jetzt die Ergebnisse."; commitMain(); goTop(); return;

    /* betting office */
    case "go-slip": go("slip"); return;
    case "q-open": ui.openQ=ui.openQ===v?null:v; render(); return;
    case "stk":
      var sc=b.getAttribute("data-s"), q=b.getAttribute("data-q"), dd=+b.getAttribute("data-d");
      if(sc==="live"){
        if(!ui.liveStake) ui.liveStake={};
        if(dd>0 && (liveLeft(ME,f)-sumStakes(ui.liveStake))<=0) return;
        var lv=(ui.liveStake[v]|0)+dd; if(lv<=0) delete ui.liveStake[v]; else ui.liveStake[v]=lv; render(); return;
      }
      var map=sc==="slip"?ui.slip:ui.stips, B=sc==="slip"?main.rules.bets.ep:main.rules.bets.season;
      if(!map) return;
      if(dd>0 && sumStakes(map)>=B) return;
      map[q]=map[q]||{}; var nv=(map[q][v]|0)+dd; if(nv<=0) delete map[q][v]; else map[q][v]=nv; if(!Object.keys(map[q]).length) delete map[q];
      render(); return;
    case "surv-sel": ui.surv=ui.surv===v?null:v; render(); return;
    case "slip-save":
      if(!e||e.status!=="open") return;
      ui.msg="Wettschein gespeichert.";
      saveEntry(ME,"bet:"+f,{stakes:JSON.parse(JSON.stringify(ui.slip||{})),surv:ui.surv||null},"Zu spät: Die Wetten für diese Folge sind schon geschlossen."); return;
    case "season-save":
      if(!ui.stips||!sumStakes(ui.stips)) return;
      saveEntry(ME,"season",{stakes:JSON.parse(JSON.stringify(ui.stips))},"Die Langzeitwetten sind schon geschlossen."); return;
    case "live-skip": ui.liveSeen=ui.liveSeen||[]; ui.liveSeen.push(f+":"+v); ui.liveFor=null; render(); return;
    case "live-reopen": ui.liveSeen=(ui.liveSeen||[]).filter(function(x){ return x!==f+":"+v; }); ui.liveFor=null; render(); return;
    case "live-bet":
      if(!e||e.status!=="live"||!ui.liveStake||!sumStakes(ui.liveStake)) return;
      var stake=JSON.parse(JSON.stringify(ui.liveStake)); ui.liveFor=null; ui.liveStake={};
      saveEntry(ME,"live:"+f+":"+v,{stake:stake},"Zu spät: Diese Live-Wette ist schon geschlossen."); return;
    case "live-form": if(!isAdmin()) return; ui.liveForm=true; ui.liveQ=""; ui.liveO="Ja, Nein"; ui.err=""; render(); return;
    case "live-form-close": ui.liveForm=false; ui.err=""; render(); return;
    case "live-preset": ui.liveO=val("lo")||"Ja, Nein"; ui.liveQ=LIVE_PRESETS[+v]||""; render(); return;
    case "live-start":
      if(!isAdmin()||!e||e.status!=="live") return;
      var lq=val("lq"), lo=val("lo").split(/[,\n]/).map(function(x){ return x.trim(); }).filter(function(x){ return x; });
      ui.liveQ=lq; ui.liveO=val("lo"); ui.err="";
      if(lq.length<3){ ui.err="Bitte eine Frage eintragen."; render(); return; }
      lo=lo.filter(function(x,i){ return lo.map(function(y){ return y.toLowerCase(); }).indexOf(x.toLowerCase())===i; });
      if(lo.length<2||lo.length>6){ ui.err="Bitte 2 bis 6 verschiedene Antworten, mit Komma getrennt."; render(); return; }
      var lid=String(e.live.reduce(function(m,x){ return Math.max(m,+x.id||0); },0)+1);
      e.live.push({id:lid,q:lq,opts:lo.map(function(x,i){ return {id:"o"+i,label:x.slice(0,40)}; }),win:null,state:"open"});
      ui.liveSeen=ui.liveSeen||[]; ui.liveSeen.push(f+":"+lid);
      ui.liveForm=false; ui.msg="Live-Wette gestartet. Sie erscheint jetzt auf allen Handys."; commitMain(); return;
    case "live-close": if(!isAdmin()||!e) return; e.live.forEach(function(l){ if(l.id===v) l.state="closed"; }); commitMain(); return;
    case "live-win": if(!isAdmin()||!e) return; e.live.forEach(function(l){ if(l.id===cid){ l.win=[v]; l.state="done"; } }); commitMain(); return;
    case "live-undo": if(!isAdmin()||!e) return; e.live.forEach(function(l){ if(l.id===v){ l.win=null; l.state="closed"; } }); commitMain(); return;
    case "cq-add":
      if(!isAdmin()||!e||e.status!=="open") return;
      var cq=val("cq"), co=val("co").split(/[,\n]/).map(function(x){ return x.trim(); }).filter(function(x){ return x; }); ui.err="";
      if(cq.length<3){ ui.err="Bitte eine Frage eintragen."; render(); return; }
      co=co.filter(function(x,i){ return co.map(function(y){ return y.toLowerCase(); }).indexOf(x.toLowerCase())===i; });
      if(co.length<2||co.length>6){ ui.err="Bitte 2 bis 6 verschiedene Antworten, mit Komma getrennt."; render(); return; }
      e.custom.push({id:rid(),q:cq,opts:co.map(function(x,i){ return {id:"o"+i,label:x.slice(0,40)}; }),win:null});
      ui.flash=""; ui.msg="Wette hinzugefügt."; commitMain(); return;
    case "cq-del":
      if(!isAdmin()||!e||e.status!=="open") return;
      if(((net.pots&&net.pots.bet)||{})[f+":c-"+v]){ ui.err="Auf diese Wette wurde schon gesetzt, sie kann nicht mehr entfernt werden."; render(); return; }
      e.custom=e.custom.filter(function(c){ return c.id!==v; }); commitMain(); return;
    case "cq-win": if(!isAdmin()||!e) return; e.custom.forEach(function(c){ if(c.id===cid) c.win=[v]; }); commitMain(); return;
    case "bet-step":
      if(!isAdmin()) return; var lim={ep:[1,50],live:[0,30],season:[0,100],surv:[0,20]}[v]; if(!lim) return;
      main.rules.bets[v]=Math.max(lim[0],Math.min(lim[1],main.rules.bets[v]+(+b.getAttribute("data-d")))); commitMain(); return;

    /* admin */
    case "pe-open":
      if(!isAdmin()) return; var po=personById(v); if(!po) return;
      ui.pedit=v; ui.pName=po.name; ui.pStatus=po.outIn!=null?"out":"in"; ui.pOut=po.outIn||Math.max(1,(curEp()||nextToOpen())-1); ui.pTeam=ownerOf(v)||""; ui.err=""; ui.msg=""; render(); return;
    case "pe-new": if(!isAdmin()) return; ui.pedit="__new"; ui.pName=""; ui.pStatus="in"; ui.pOut=1; ui.pTeam=""; ui.err=""; ui.msg=""; render(); return;
    case "pe-cancel": ui.pedit=null; ui.err=""; render(); return;
    case "pe-status": syncEdName(); ui.pStatus=v; render(); return;
    case "pe-out": syncEdName(); ui.pOut=Math.max(1,Math.min(30,ui.pOut+(+b.getAttribute("data-d")))); render(); return;
    case "pe-team": syncEdName(); ui.pTeam=v||""; render(); return;
    case "pe-save":
      if(!isAdmin()) return; syncEdName(); var pn2=ui.pName.trim(); ui.err="";
      if(!pn2){ ui.err="Bitte einen Namen eintragen."; render(); return; }
      var tgt;
      if(ui.pedit==="__new"){ var nf=curEp()||nextToOpen(); tgt={id:"t-"+slug(pn2)+"-"+makeCode(4).toLowerCase(),name:pn2,full:pn2,kind:"t",sub:"Verführer*in · neu ab "+epName(nf),couple:null,inFrom:nf,outIn:null,outType:null,custom:true}; main.persons.push(tgt); }
      else { tgt=personById(ui.pedit); if(!tgt) return; tgt.name=pn2; }
      if(ui.pStatus==="out"){ tgt.outIn=Math.max(tgt.inFrom||1,ui.pOut); tgt.outType=tgt.outType||"raus"; } else { tgt.outIn=null; tgt.outType=null; }
      var dsOwner=draftState().taken[tgt.id]||"";
      if(ui.pTeam===dsOwner) delete main.assign[tgt.id]; else main.assign[tgt.id]=ui.pTeam;
      ui.pedit=null; ui.msg=tgt.name+" gespeichert."; commitMain(); return;
    case "ed-open": if(!isAdmin()) return; var eo=evByKey(v); if(!eo) return; ui.edit=v; ui.edName=eo.label; ui.edPts=eo.pts; ui.edG=eo.g; ui.err=""; ui.msg=""; ui.confirm=null; render(); return;
    case "ed-new": if(!isAdmin()) return; ui.edit="__new"; ui.edName=""; ui.edPts=1; ui.edG="Drama"; ui.err=""; ui.msg=""; ui.confirm=null; render(); return;
    case "ed-cancel": ui.edit=null; ui.err=""; ui.confirm=null; render(); return;
    case "ed-pts": syncEdName(); ui.edPts=clampPts(ui.edPts+(+b.getAttribute("data-d"))); render(); return;
    case "ed-g": syncEdName(); ui.edG=GROUPS.indexOf(v)>=0?v:"Drama"; render(); return;
    case "ed-save":
      if(!isAdmin()||!ui.edit) return; syncEdName(); var nm2=ui.edName.trim().replace(/\s+/g," "); ui.err="";
      if(!nm2){ ui.err="Bitte einen Namen eintragen."; render(); return; }
      if(ui.edPts===0){ ui.err="Ein Ereignis braucht Plus- oder Minuspunkte, nicht 0."; render(); return; }
      if(main.rules.events.some(function(x){ return !x.hidden && x.k!==ui.edit && x.label.toLowerCase()===nm2.toLowerCase(); })){ ui.err="Ein Ereignis mit diesem Namen gibt es schon."; render(); return; }
      if(ui.edit==="__new") main.rules.events.push({k:"e"+rid(),label:nm2,g:ui.edG,pts:ui.edPts,hidden:false,custom:true});
      else { var es=evByKey(ui.edit); if(!es) return; es.label=nm2; es.pts=ui.edPts; es.g=ui.edG; }
      ui.msg="„"+nm2+"“ gespeichert."; ui.edit=null; commitMain(); return;
    case "ed-del": syncEdName(); ui.confirm="ed-del"; render(); return;
    case "ed-del-yes":
      if(!isAdmin()) return; var ed=evByKey(ui.edit); if(!ed||CORE_KEYS.indexOf(ed.k)>=0) return;
      if(evUses(ed.k)>0) ed.hidden=true; else main.rules.events=main.rules.events.filter(function(x){ return x.k!==ed.k; });
      ui.msg="„"+ed.label+"“ entfernt."; ui.edit=null; ui.confirm=null; commitMain(); return;
    case "ed-restore": if(!isAdmin()) return; var er=evByKey(v); if(er){ er.hidden=false; ui.msg="„"+er.label+"“ ist wieder da."; commitMain(); } return;
    case "rule-step":
      if(!isAdmin()) return; var pp=v.split("."); if(!main.rules[pp[0]]||main.rules[pp[0]][pp[1]]==null) return;
      main.rules[pp[0]][pp[1]]=clampPts(main.rules[pp[0]][pp[1]]+(+b.getAttribute("data-d"))); ui.msg=""; commitMain(); return;
    case "rm-ask": ui.confirm="rm-"+v; render(); return;
    case "rm-yes": if(!isAdmin()||main.phase!=="join") return; if(main.removed.indexOf(v)<0) main.removed.push(v); ui.confirm=null; ui.msg="Entfernt."; commitMain(); return;
    case "fix-ask": ui.confirm="fix"; render(); return;
    case "fix-yes":
      if(!isAdmin()) return; var ld=lastDone(); if(!ld) return; ep(ld).status="live"; if(main.phase==="done") main.phase="season";
      ui.confirm=null; ui.screen="board"; ui.key=""; commitMain(); goTop(); return;
  }
});

/* ================= boot ================= */
render();
if(CODE) pull();
setInterval(function(){
  if(!CODE) return;
  if(document.visibilityState && document.visibilityState!=="visible") return;
  pull();
},4000);
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") pull(); });
window.addEventListener("hashchange",function(){ var c=codeFromHash(); if(c && c!==CODE){ setCode(c); render(); pull(); } });
})();

</script>
<script>
(function(){
"use strict";
/* tropical night: palm silhouettes (drawn once) + twinkling gold glitter */
var pc=document.getElementById("palms"), gc=document.getElementById("glitter");
if(!pc||!gc||!pc.getContext) return;
var px=pc.getContext("2d"), gx=gc.getContext("2d"), W=0, H=0, dpr=1, stars=[], reduce=false, last=0, raf=0, seed=7;
try{ reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
function rand(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
function R(a,b){ return a+rand()*(b-a); }
function frond(x,y,ang,len,bend,fill){
  var n=34, st=len/n, th=ang, p={x:x,y:y}, pts=[p];
  for(var i=1;i<=n;i++){ th+=bend/n; p={x:p.x+Math.cos(th)*st,y:p.y+Math.sin(th)*st,th:th}; pts.push(p); }
  px.fillStyle=fill; px.strokeStyle=fill; px.lineWidth=Math.max(2,len*0.012); px.lineCap="round";
  px.beginPath(); px.moveTo(x,y); pts.forEach(function(q){ px.lineTo(q.x,q.y); }); px.stroke();
  for(var j=3;j<=n;j++){
    var t=j/n, q=pts[j], L=len*0.36*Math.pow(Math.sin(Math.PI*Math.min(1,t*1.05)),0.7)*(1-0.3*t);
    [-1,1].forEach(function(s){
      var phi=q.th+s*(1.05-0.35*t)+0.18, w=Math.max(1.2,len*0.011*(1-t*0.6));
      var tx=q.x+Math.cos(phi)*L, ty=q.y+Math.sin(phi)*L+L*0.18;
      var cx=q.x+Math.cos(phi-s*0.12)*L*0.55, cy=q.y+Math.sin(phi-s*0.12)*L*0.55;
      var nx=Math.cos(q.th)*w, ny=Math.sin(q.th)*w;
      px.beginPath(); px.moveTo(q.x-nx,q.y-ny); px.quadraticCurveTo(cx-nx,cy-ny,tx,ty); px.quadraticCurveTo(cx+nx,cy+ny,q.x+nx,q.y+ny); px.closePath(); px.fill();
    });
  }
}
function drawPalms(){
  px.setTransform(dpr,0,0,dpr,0,0); px.clearRect(0,0,W,H); seed=7;
  var M=Math.max(W,H);
  var layers=[{fill:"rgba(118,52,150,.42)",scale:1.15,blur:3},{fill:"rgba(14,3,24,.72)",scale:0.95,blur:0}];
  layers.forEach(function(Ly){
    try{ px.filter=Ly.blur?"blur("+Ly.blur+"px)":"none"; }catch(e){}
    var s=Ly.scale;
    for(var i=0;i<5;i++) frond(-0.06*W,-0.04*H,R(0.15,1.35),M*R(0.42,0.62)*s,R(0.5,0.9),Ly.fill);
    for(var k=0;k<5;k++) frond(1.07*W,R(0.25,0.45)*H,Math.PI+R(-0.75,0.45),M*R(0.4,0.6)*s,R(-0.9,-0.5),Ly.fill);
    for(var m=0;m<3;m++) frond(-0.04*W,1.04*H,R(-1.1,-0.35),M*R(0.35,0.5)*s,R(0.4,0.8),Ly.fill);
  });
  try{ px.filter="none"; }catch(e){}
}
function makeStars(){
  stars=[]; seed=99;
  var n=Math.round(Math.min(140,W*H/9000));
  for(var i=0;i<n;i++) stars.push({x:R(0,W),y:R(0,H),r:R(0.5,1.8),sp:R(0.6,1.8),ph:R(0,6.3),c:rand()<0.6?"255,214,140":(rand()<0.5?"255,255,255":"255,170,220"),glint:i<9});
}
function drawGlitter(t){
  gx.setTransform(dpr,0,0,dpr,0,0); gx.clearRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){
    var s=stars[i], a=reduce?0.75:0.35+0.65*Math.max(0,Math.sin(t*0.001*s.sp+s.ph));
    gx.fillStyle="rgba("+s.c+","+a.toFixed(3)+")";
    gx.beginPath(); gx.arc(s.x,s.y,s.r,0,6.283); gx.fill();
    if(s.glint){
      var L=s.r*6*a; gx.strokeStyle="rgba("+s.c+","+(a*0.8).toFixed(3)+")"; gx.lineWidth=0.8;
      gx.beginPath(); gx.moveTo(s.x-L,s.y); gx.lineTo(s.x+L,s.y); gx.moveTo(s.x,s.y-L); gx.lineTo(s.x,s.y+L); gx.stroke();
    }
  }
}
function size(){
  dpr=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight;
  [pc,gc].forEach(function(c){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); });
  drawPalms(); makeStars(); drawGlitter(performance.now());
}
function loop(t){
  raf=requestAnimationFrame(loop);
  if(document.hidden || t-last<50) return;
  last=t; drawGlitter(t);
}
var rt=null;
window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(size,150); });
size();
if(!reduce && window.requestAnimationFrame) raf=requestAnimationFrame(loop);
})();

</script>
