name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Android-Projekt anlegen
        run: npx cap add android

      - name: App-Icon und Startbild erzeugen
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor "#E8F0FB" --iconBackgroundColorDark "#070B16" --splashBackgroundColor "#E8F0FB" --splashBackgroundColorDark "#070B16"

      - name: Projekt abgleichen
        run: npx cap sync android

      - name: APK bauen
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../Sommerhaus-Liga.apk

      - name: APK als Build-Ergebnis speichern
        uses: actions/upload-artifact@v4
        with:
          name: Sommerhaus-Liga-APK
          path: Sommerhaus-Liga.apk

      - name: APK zum Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: Sommerhaus-Liga für Android
          make_latest: true
          body: |
            Die Android-App der Sommerhaus-Liga.

            Auf dem Handy `Sommerhaus-Liga.apk` antippen, herunterladen und öffnen. Beim ersten Mal fragt Android, ob Installationen aus dieser Quelle erlaubt sind.

            Die App lädt immer die aktuelle Liga von https://moritzbauer171-art.github.io/Sommerhaus/ und braucht deshalb Internet.
          files: Sommerhaus-Liga.apk
